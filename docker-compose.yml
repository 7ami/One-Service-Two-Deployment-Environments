services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cs554-midterm-app:1.0.0
    container_name: cs554-compose-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SERVICE_NAME=cs554-compose-node
      - MESSAGE=Hello from Docker Compose inside Linux VM!
