apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs554-web-deployment
  labels:
    app: cs554-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs554-web
  template:
    metadata:
      labels:
        app: cs554-web
    spec:
      containers:
      - name: web
        image: cs554-midterm-app:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: SERVICE_NAME
          value: "cs554-k8s-service"
        - name: MESSAGE
          value: "Hello from CS 554 Kubernetes Deployment!"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 3
          timeoutSeconds: 1
          failureThreshold: 2
          successThreshold: 1
